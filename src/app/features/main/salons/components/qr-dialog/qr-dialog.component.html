<div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800">
    <h2 class="text-lg font-semibold text-slate-900 dark:text-white m-0">QR Code</h2>
    <button mat-icon-button (click)="close()">
        <lucide-angular name="x" class="w-5 h-5 text-slate-500"></lucide-angular>
    </button>
</div>

<div class="p-6 flex flex-col items-center justify-center">
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6">
        <img [src]="data.qrUrl?.qrCodeUrl" alt="Salon QR Code" class="w-64 h-64 object-contain">
    </div>

    <p class="text-sm text-slate-500 text-center mb-6 max-w-xs">
        Scan this QR code to view {{ data.salonName }} details on the mobile app.
    </p>

    <div class="flex w-full gap-3">
        <button mat-stroked-button class="flex-1" (click)="close()">Close</button>
        <button mat-flat-button color="primary" class="flex-1" (click)="downloadQr()">
            <lucide-angular name="download" class="w-4 h-4 mr-2"></lucide-angular>
            Download
        </button>
    </div>
</div>
