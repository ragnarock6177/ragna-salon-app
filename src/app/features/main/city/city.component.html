<div class="grid grid-cols-1 xl:grid-cols-3 gap-4 h-full min-h-0">

    <div class="xl:col-span-3 h-full min-h-0">

        <div class="w-full h-full flex flex-col bg-white dark:bg-slate-900
         rounded-2xl border border-slate-200 dark:border-slate-800
         shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-slate-800">
                <div class="flex flex-col">
                    <h2 class="text-base font-semibold tracking-tight text-slate-900 dark:text-slate-100">Cities
                    </h2>

                </div>
                <div class="flex items-center gap-2">
                    <button (click)="filter = filter === 'active' ? 'all' : 'active'; loadInitialCities()"
                        class="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-gray-300 dark:border-slate-700 px-3 py-1.5 text-xs text-slate-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800">
                        <lucide-angular name="funnel" class="w-3.5 h-3.5"></lucide-angular>
                        <span>{{ filter === 'active' ? 'Active only' : 'Filters' }}</span>
                    </button>
                    <button (click)="openAdd()"
                        class="inline-flex items-center gap-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-medium px-3 py-1.5 transition">
                        <lucide-angular name="plus" class="w-3.5 h-3.5"></lucide-angular>
                        Add City
                    </button>
                </div>
            </div>

            <div class="flex-1 min-h-0 overflow-auto" (scroll)="onScroll($event)">
                <table class="w-full text-sm overflow-auto">
                    <thead
                        class="bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 sticky top-0">
                        <tr>
                            <th class="text-left font-medium py-2.5 px-4">City</th>
                            <th class="text-left font-medium py-2.5 px-4">Status</th>
                            <th class="text-left font-medium py-2.5 px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-slate-800">
                        <tr *ngFor="let city of displayedCities; let i = index"
                            class="hover:bg-gray-50 dark:hover:bg-slate-800/50">
                            <td class="py-2.5 px-4">
                                <div class="flex items-center gap-3">
                                    <lucide-angular name="map-pin" class="w-3.5 h-3.5"></lucide-angular>
                                    <div class="flex flex-col">
                                        <span class="text-sm text-slate-900 dark:text-slate-100">{{ city.name }}</span>
                                    </div>
                                </div>
                            </td>
                            <td class="py-2.5 px-4">
                                <span (click)="toggleStatus(city)"
                                    class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs border cursor-pointer"
                                    [ngClass]="{
                                        'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-700': city.is_active ===  1,
                                        'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-400 border-gray-300 dark:border-gray-700': city.is_active === 0
                                    }">
                                    <span class="h-1.5 w-1.5 rounded-full" [ngClass]="{
                                        'bg-emerald-500': city.is_active === 1,
                                        'bg-gray-500': city.is_active === 0
                                    }"></span>
                                    {{ city.is_active === 1 ? 'Active' : 'Inactive' }}
                                </span>
                            </td>
                            <td class="py-2.5 px-4">
                                <div class="inline-flex items-center gap-2">
                                    <button mat-stroked-button (click)="edit(city)" class="btn-xs">Edit</button>
                                    <button mat-flat-button (click)="delete(city)"
                                        class="btn-xs bg-red-600!">Delete</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div *ngIf="loading"
                    class="flex justify-center py-4 text-center text-sm text-slate-500 dark:text-slate-400">
                    <lucide-angular name="loader" class="w-4 h-4 animate-spin"></lucide-angular>
                </div>
            </div>

            <div
                class="px-4 py-3 border-t border-gray-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-400 bg-gray-50 dark:bg-slate-900">
                <span>Showing {{ displayedCities.length }} of {{ filtered.length }} cities</span>
            </div>
        </div>
    </div>
</div>
